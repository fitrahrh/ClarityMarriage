admin-force-divorce: "<yellow>Successfully forced divorce for <player1> and <player2>!</yellow>"
admin-info: "<newline><gold>--- Admin Marriage Info: <player> ---</gold><newline><gray>Partner:</gray> <partner><newline><gray>Date:</gray> <date><newline><gray>Playtime:</gray> <playtime><newline>"

